<!-- charging.component.html -->
<div class="relative w-screen h-screen overflow-hidden bg-black flex items-center justify-center">
  <!-- Fondo animado -->
  <div class="absolute inset-0 bg-gradient-to-b from-[#020617] via-[#050816] to-black"></div>

  <!-- Glow -->
  <div
    class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[800px] bg-blue-500/10 blur-3xl rounded-full"
  ></div>

  <!-- Contenido -->
  <div
    class="relative z-10 flex flex-col items-center justify-center w-full h-full text-center px-6"
  >
    <!-- Título -->
    <p class="text-white/70 uppercase tracking-[8px] text-sm mb-10">Experiencia Subaru</p>

    <h1 class="text-white font-bold text-5xl md:text-7xl leading-tight">
      Cargando <br />
      Experiencia
    </h1>

    <p class="mt-6 text-gray-400 text-lg md:text-2xl">Conectando con el futuro</p>

    <!-- Botón central -->
    <button
      (click)="pulse()"
      class="relative mt-20 flex items-center justify-center w-56 h-56 rounded-full active:scale-95 transition-transform duration-200"
    >
      <!-- Aura -->
      <span class="absolute w-56 h-56 rounded-full bg-blue-500/20"></span>

      <!-- Glow -->
      <span class="absolute w-48 h-48 rounded-full bg-blue-500/10 blur-2xl"></span>

      <!-- Ring -->
      <span
        [class.animate-spin-slow]="isAnimating"
        class="absolute w-44 h-44 rounded-full border-[6px] border-blue-400 border-t-transparent shadow-[0_0_40px_#3b82f6]"
      ></span>

      <!-- Centro -->
      <span
        class="relative flex items-center justify-center w-28 h-28 rounded-full bg-blue-500 shadow-[0_0_60px_#3b82f6]"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-12 h-12 text-white"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </span>
    </button>

    <!-- Barra -->
    <div class="w-full max-w-3xl mt-24">
      <div class="relative h-10 rounded-xl border border-blue-400/30 bg-[#071020] overflow-hidden">
        <!-- Aura tipo botón -->
        <!-- <div
          *ngIf="isAnimating"
          class="absolute inset-0 rounded-xl bg-blue-400/20 animate-ping"
        ></div> -->

        <!-- Ring animado -->
        <!-- <div
          *ngIf="isAnimating"
          class="absolute inset-0 rounded-xl border-2 border-cyan-300/60 animate-pulse"
        ></div> -->

        <!-- Barra progreso -->
        <div
          class="relative h-full rounded-xl bg-gradient-to-r from-cyan-300 via-blue-400 to-blue-600 transition-all duration-500 ease-out shadow-[0_0_30px_#3b82f6]"
          [style.width.%]="progress"
        >
          <!-- Shine -->
          <div
            *ngIf="isAnimating"
            class="absolute top-0 left-0 h-full w-32 bg-white/20 blur-xl animate-shine"
          ></div>
        </div>
      </div>

      <div class="mt-6 flex flex-col items-center">
        <p class="text-white tracking-[6px] text-sm">CARGANDO</p>
      </div>
    </div>
  </div>
</div>
